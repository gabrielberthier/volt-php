# Matches the container's 1 CPU limit (auto would spawn one per host core).
worker_processes 1;

events {
    worker_connections 4096;
}

http {
    access_log off;
    keepalive_requests 100000;

    # Re-resolve sync-fpm via Docker DNS so a recreated FPM container
    # (new IP) doesn't leave nginx pointing at a dead address.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream fpm {
        zone fpm 64k;
        server sync-fpm:9000 resolve;
    }

    server {
        listen 8080;

        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/benchmark/sync/public/index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_read_timeout 300s;
            fastcgi_pass fpm;
        }
    }
}
